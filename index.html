<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For My Versha 🐷❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #ffdde1, #ee9ca7);
  overflow: hidden;
  color: #333;
}

header {
  text-align: center;
  padding: 20px;
}

header h1 {
  font-size: 2.2rem;
}

header p {
  font-size: 1.1rem;
}

.slideshow {
  position: relative;
  max-width: 90%;
  height: 65vh;
  margin: auto;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 10px 25px rgba(0,0,0,0.3);
  background: #fff;
}

.slide {
  position: absolute;
  width: 100%;
  height: 100%;
  opacity: 0;
  transition: opacity 1.2s ease-in-out;
}

.slide img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.active {
  opacity: 1;
}

.controls {
  text-align: center;
  margin-top: 15px;
}

button {
  background: #ff6f91;
  border: none;
  padding: 10px 18px;
  margin: 0 8px;
  border-radius: 30px;
  font-size: 1rem;
  color: white;
  cursor: pointer;
}

button:hover {
  background: #ff3e6c;
}

.message {
  background: rgba(255,255,255,0.9);
  margin: 20px auto;
  padding: 20px;
  max-width: 800px;
  border-radius: 20px;
  text-align: center;
}

footer {
  text-align: center;
  font-size: 0.9rem;
  padding-bottom: 10px;
}

/* Floating hearts & pigs */
.float {
  position: absolute;
  font-size: 24px;
  animation: floatUp 6s linear infinite;
}

@keyframes floatUp {
  0% { transform: translateY(100vh); opacity: 0; }
  10% { opacity: 1; }
  100% { transform: translateY(-10vh); opacity: 0; }
}
</style>
</head>

<body>

<header>
  <h1>My Forever Versha 🐷❤️</h1>
  <p>You are my favorite person, my home, my cutest pig 🐽💖</p>
</header>

<div class="slideshow">
  <div class="slide active"><img src="IMG_0697.jpeg"></div>
  <div class="slide"><img src="IMG_0541.jpeg"></div>
  <div class="slide"><img src="IMG_0514.jpeg"></div>
  <div class="slide"><img src="IMG_0461.jpeg"></div>
  <div class="slide"><img src="IMG_0462.jpeg"></div>
  <div class="slide"><img src="IMG_0444.jpeg"></div>
</div>

<div class="controls">
  <button onclick="prevSlide()">⏮️</button>
  <button onclick="toggleMusic()">🎶</button>
  <button onclick="nextSlide()">⏭️</button>
</div>

<div class="message">
  <p>Versha, every smile of yours is my favorite view.</p>
  <p>You are my comfort, my happiness, my forever pig 🐷💕</p>
  <p>Happy Valentine’s Week, my love ❤️</p>
  <strong>Forever yours,<br>Akash 🐷</strong>
</div>

<footer>
  Made with endless love & pig energy 🐷🐷🐷
</footer>

<audio id="music" loop>
  <source src="love.mp3" type="audio/mpeg">
</audio>

<script>
let slides = document.querySelectorAll('.slide');
let index = 0;
let interval = setInterval(nextSlide, 4000);
let music = document.getElementById("music");

function showSlide(i) {
  slides.forEach(s => s.classList.remove('active'));
  slides[i].classList.add('active');
}

function nextSlide() {
  index = (index + 1) % slides.length;
  showSlide(index);
}

function prevSlide() {
  index = (index - 1 + slides.length) % slides.length;
  showSlide(index);
}

function toggleMusic() {
  if (music.paused) music.play();
  else music.pause();
}

/* Floating hearts & pigs */
setInterval(() => {
  const el = document.createElement("div");
  el.className = "float";
  el.style.left = Math.random() * 100 + "vw";
  el.innerText = Math.random() > 0.5 ? "❤️" : "🐷";
  el.style.animationDuration = (4 + Math.random() * 4) + "s";
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 6000);
}, 500);
</script>

</body>
</html>
