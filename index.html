<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Forever ❤️</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --accent: #ff4d6d; --bg: #fff0f3; }
        body { 
            margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; 
            font-family: 'Georgia', serif; overflow: hidden;
            background: radial-gradient(circle, #fff0f3 0%, #ffcbd1 100%);
        }
        .hidden { display: none !important; }
        .container { 
            text-align: center; max-width: 450px; width: 90%; padding: 20px; 
            background: rgba(255, 255, 255, 0.98); border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15); border: 2px solid white;
            max-height: 95vh; overflow-y: auto; position: relative;
        }
        /* Layout: Photo on top, BIG Bubu on bottom */
        .photo-box { width: 100%; border-radius: 15px; border: 4px solid white; box-shadow: 0 5px 15px rgba(0,0,0,0.1); margin-bottom: 10px; }
        .bubu-big { width: 85%; border-radius: 20px; border: 4px solid var(--accent); background: white; transition: transform 0.3s; }
        
        .description { margin: 15px 0; font-size: 1.15rem; color: #444; font-style: italic; min-height: 50px; }
        .btn-dramatic {
            background: var(--accent); color: white; border: none; padding: 16px 45px;
            border-radius: 50px; font-size: 1.1rem; cursor: pointer; font-weight: bold;
        }
        .no-btn { background: #95a5a6; position: absolute; }
        
        /* Debug message styling */
        .error-hint { font-size: 0.7rem; color: red; margin-top: 5px; display: none; }
    </style>
</head>
<body>

    <div id="player" style="position: absolute; left: -9999px;"></div>

    <div id="screen1" class="container">
        <img src="dudu bubu love.jpeg" class="bubu-big" onerror="showErr(this)">
        <h1 style="color:var(--accent)">Hi My Bubi ❤️</h1>
        <button class="btn-dramatic" onclick="initExperience()">Open Our Story 🎵</button>
    </div>

    <div id="screen2" class="container hidden">
        <h2 style="color:var(--accent)">Unlock with Love</h2>
        <input type="text" id="pass" placeholder="Type 'I LOVE YOU'" 
               style="width: 80%; padding: 15px; border: 2px solid var(--accent); border-radius: 20px; text-align: center;" 
               oninput="checkPass()">
    </div>

    <div id="screen3" class="container hidden">
        <img id="mem-img" class="photo-box" src="">
        <img id="bubu-img" class="bubu-big" src="" onerror="showErr(this)">
        <div id="err-msg" class="error-hint">File not found. Check if name matches exactly!</div>
        <p class="description" id="mem-desc"></p>
        <button class="btn-dramatic" id="next-btn" onclick="nextMem()">Next →</button>
    </div>

    <div id="screen4" class="container hidden">
        <img src="Dudu Bubu GIF - Dudu Bubu - Discover & Share GIFs.gif" class="bubu-big" onerror="showErr(this)">
        <h2 style="color: #ff3355; font-size: 1.8rem; margin-top: 15px;">Will you be my Dalenvine? 🌹</h2>
        <div style="height: 100px; position: relative; margin-top: 20px;">
            <button class="btn-dramatic" style="background:#27ae60; width: 85%;" onclick="yes()">YES! 💖</button>
            <button class="btn-dramatic no-btn" id="no-btn" onmouseover="moveNo()">No</button>
        </div>
    </div>

    <div id="screen5" class="container hidden">
        <img src="dudu bubu love.jpeg" class="bubu-big">
        <h1 style="color:var(--accent)">It's a Date! ❤️</h1>
        <p>Send me those <b>photos</b> and let's <b>Video Call</b>! 🎥</p>
    </div>

    <script>
        // TRIPLE CHECK THESE FILENAMES MATCH YOUR UPLOADED FILES EXACTLY
        const memories = [
            { photo: "IMG_0444.jpeg", bubu: "_.jpeg", text: "Every story has a beginning... ✨" },
            { photo: "IMG_0461.jpeg", bubu: "_ (1).jpeg", text: "You're my favorite person to irritate! 😂" },
            { photo: "IMG_0462.jpeg", bubu: "_ (2).jpeg", text: "I just want to bite you! 🦷" },
            { photo: "IMG_0514.jpeg", bubu: "_ (3).jpeg", text: "I'll always be here to hold you. 🥺" },
            { photo: "IMG_0541.jpeg", bubu: "dudu bubu love.jpeg", text: "You are my heart and home." },
            { photo: "IMG_0697.jpeg", bubu: "Dudu Bubu GIF - Dudu Bubu - Discover & Share GIFs.gif", text: "Now for the question..." }
        ];

        let step = 0;

        function showErr(imgElement) {
            console.error("Failed to load: " + imgElement.src);
            document.getElementById('err-msg').style.display = 'block';
            document.getElementById('err-msg').innerText = "Missing file: " + imgElement.src.split('/').pop();
        }

        function initExperience() {
            document.getElementById('player').innerHTML = `<iframe width="560" height="315" src="https://www.youtube.com/embed/HTFpTVaHvjw?autoplay=1&loop=1&playlist=HTFpTVaHvjw" allow="autoplay"></iframe>`;
            document.getElementById('screen1').classList.add('hidden');
            document.getElementById('screen2').classList.remove('hidden');
        }

        function checkPass() {
            if (document.getElementById('pass').value.toUpperCase() === "I LOVE YOU") {
                document.getElementById('screen2').classList.add('hidden');
                document.getElementById('screen3').classList.remove('hidden');
                updateContent();
            }
        }

        function updateContent() {
            document.getElementById('err-msg').style.display = 'none';
            document.getElementById('mem-img').src = memories[step].photo;
            document.getElementById('bubu-img').src = memories[step].bubu;
            document.getElementById('mem-desc').innerText = memories[step].text;
            if(step === memories.length - 1) document.getElementById('next-btn').innerText = "Ask Me... ❤️";
        }

        function nextMem() {
            step++;
            if (step < memories.length) { updateContent(); } 
            else {
                document.getElementById('screen3').classList.add('hidden');
                document.getElementById('screen4').classList.remove('hidden');
            }
        }

        function moveNo() {
            const btn = document.getElementById('no-btn');
            btn.style.left = Math.random() * 60 + '%';
            btn.style.top = Math.random() * 60 + '%';
        }

        function yes() {
            document.getElementById('screen4').classList.add('hidden');
            document.getElementById('screen5').classList.remove('hidden');
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
        }
    </script>
</body>
</html>
