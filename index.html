<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Valentine</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(to right, #ff9a9e, #fad0c4);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.container {
  width: 90%;
  max-width: 720px;
  background: white;
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  text-align: center;
}

.slideshow {
  position: relative;
  width: 100%;
  height: 320px;
  overflow: hidden;
  border-radius: 15px;
}

.slide {
  position: absolute;
  width: 100%;
  height: 100%;
  opacity: 0;
  transition: opacity 1s ease;
}

.slide img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.slide.active { opacity: 1; }

.stack-container {
  position: relative;
  width: 260px;
  height: 260px;
  margin: 30px auto;
}

.stack-container img {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 15px;
  transition: transform 1s, opacity 1s;
}

textarea {
  width: 100%;
  height: 70px;
  border-radius: 10px;
  padding: 10px;
}

button {
  margin-top: 10px;
  padding: 10px 20px;
  border: none;
  border-radius: 10px;
  background: #ff4b6e;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

.intro-screen, .main-content, .game-screen, .final-screen {
  display: none;
}

.confetti {
  position: fixed;
  width: 10px;
  height: 10px;
  top: 0;
  animation: fall linear forwards;
}

@keyframes fall {
  to {
    transform: translateY(100vh) rotate(720deg);
    opacity: 0;
  }
}

</style>
</head>

<body>

<div class="container">

<div class="intro-screen" id="introScreen" style="display:block">
<h1>Hey ❤️</h1>
<p>I made something special for you...</p>
<button onclick="startExperience()">Start</button>
</div>

<div class="main-content" id="mainContent">
<h1>Our Memories ❤️</h1>

<div class="slideshow">
<div class="slide active"><img src="code/photo1.jpg"></div>
<div class="slide"><img src="code/photo2.jpg"></div>
<div class="slide"><img src="code/photo3.jpg"></div>
<div class="slide"><img src="code/photo4.jpg"></div>
<div class="slide"><img src="code/photo5.jpg"></div>
</div>

<h2>Moments I Love</h2>

<div class="stack-container" id="stackContainer">
<img src="code/photo1.jpg">
<img src="code/photo2.jpg">
<img src="code/photo3.jpg">
<img src="code/photo4.jpg">
<img src="code/photo5.jpg">
</div>

<textarea placeholder="Write something for me ❤️"></textarea>

<button onclick="showGame()">Next</button>
</div>

<div class="game-screen" id="gameScreen">
<h2>Fun Love Quiz 😄</h2>
<p>Where did we first meet?</p>
<input id="quiz1" placeholder="Type answer">
<button onclick="quizStep2()">Next</button>

<div id="quiz2" style="display:none">
<p>Who loves more? 😜</p>
<input id="quiz2input" placeholder="Type name">
<button onclick="finishQuiz()">Submit</button>
</div>

<p id="quizResult"></p>
</div>

<div class="final-screen" id="finalScreen">
<h2>Will You Be My Valentine? ❤️</h2>
<button onclick="yesClicked()">Yes</button>
<button onclick="alert('I will keep trying 😄')">No</button>
</div>

</div>

<script>

function startExperience(){
introScreen.style.display='none';
mainContent.style.display='block';
}

let slides=document.querySelectorAll('.slide');
let currentSlide=0;

setInterval(()=>{
slides[currentSlide].classList.remove('active');
currentSlide=(currentSlide+1)%slides.length;
slides[currentSlide].classList.add('active');
},3000);

let stackImages=document.querySelectorAll('#stackContainer img');
let stackIndex=0;

setInterval(()=>{
stackImages.forEach((img,i)=>{
img.style.transform=`translateY(${(i-stackIndex)*10}px) scale(${1-(i-stackIndex)*0.05})`;
img.style.opacity=(i===stackIndex)?1:0.5;
});
stackIndex=(stackIndex+1)%stackImages.length;
},2000);

function showGame(){
mainContent.style.display='none';
gameScreen.style.display='block';
}

function quizStep2(){
document.getElementById('quiz2').style.display='block';
}

function finishQuiz(){
gameScreen.style.display='none';
finalScreen.style.display='block';
}

function yesClicked(){
alert('Yayyyy 🎉🥳❤️');
launchConfetti();
}

function launchConfetti(){
for(let i=0;i<120;i++){
let conf=document.createElement('div');
conf.classList.add('confetti');
conf.style.left=Math.random()*100+'vw';
conf.style.background=['#ff4b6e','#ffd700','#ff69b4','#ffffff'][Math.floor(Math.random()*4)];
conf.style.animationDuration=(Math.random()*3+2)+'s';
document.body.appendChild(conf);
setTimeout(()=>conf.remove(),5000);
}
}

</script>

</body>
</html>
