<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Valentine</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(to right, #ff9a9e, #fad0c4);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.container {
  width: 90%;
  max-width: 700px;
  background: white;
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  text-align: center;
}

h1,h2 {
  margin-bottom: 15px;
}

/* Intro Screen */
.intro-screen {
  text-align: center;
}

.intro-screen button {
  background: #ff4b6e;
  color: white;
}

/* Slideshow */
.slideshow {
  position: relative;
  width: 100%;
  height: 300px;
  overflow: hidden;
  border-radius: 15px;
}

.slide {
  position: absolute;
  width: 100%;
  height: 100%;
  opacity: 0;
  transition: opacity 1s ease;
}

.slide img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 15px;
}

.slide.active {
  opacity: 1;
}

.caption {
  margin-top: 10px;
  font-size: 18px;
}

/* Stack Photos */
.stack-container {
  position: relative;
  width: 250px;
  height: 250px;
  margin: 30px auto;
}

.stack-container img {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 15px;
  transition: transform 1s, opacity 1s;
}

.message-box textarea {
  width: 100%;
  height: 70px;
  border-radius: 10px;
  padding: 10px;
  border: 1px solid #ccc;
}

button {
  margin-top: 10px;
  padding: 10px 20px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-size: 16px;
}

.next-btn {
  background: #ff4b6e;
  color: white;
}

.final-screen, .game-screen, .main-content {
  display: none;
}

/* Suspense Text */
.suspense {
  font-size: 20px;
  margin: 20px 0;
  min-height: 30px;
}

</style>
</head>

<body>

<div class="container">

  <!-- Intro -->
  <div class="intro-screen" id="introScreen">
    <h1>Hey ❤️</h1>
    <p>I made something special for you...</p>
    <button onclick="startExperience()">Start</button>
  </div>

  <!-- Main Content -->
  <div class="main-content" id="mainContent">

    <h1>Our Memories ❤️</h1>

    <div class="slideshow">
      <div class="slide active"><img src="photo1.jpg"></div>
      <div class="slide"><img src="photo2.jpg"></div>
      <div class="slide"><img src="photo3.jpg"></div>
      <div class="slide"><img src="photo4.jpg"></div>
      <div class="slide"><img src="photo5.jpg"></div>
    </div>

    <div class="caption" id="captionText">Our First Memory</div>

    <h2>Moments I Love</h2>

    <div class="stack-container" id="stackContainer">
      <img src="photo1.jpg">
      <img src="photo2.jpg">
      <img src="photo3.jpg">
      <img src="photo4.jpg">
      <img src="photo5.jpg">
    </div>

    <div class="message-box">
      <textarea placeholder="Write something for me ❤️"></textarea>
    </div>

    <div class="suspense" id="suspenseText"></div>

    <button class="next-btn" onclick="showGame()">Next</button>

  </div>

  <!-- Game Screen (Joke Game) -->
  <div class="game-screen" id="gameScreen">
    <h2>Small Game 😄</h2>
    <p>Guess my favourite person?</p>
    <input type="text" id="gameInput" placeholder="Type name here">
    <br>
    <button class="next-btn" onclick="checkGame()">Submit</button>
    <p id="gameResult"></p>
  </div>

  <!-- Final Screen -->
  <div class="final-screen" id="finalScreen">
    <h2>Will You Be My Valentine? ❤️</h2>
    <button class="next-btn" onclick="alert('Yay ❤️ Love You')">Yes</button>
    <button class="next-btn" onclick="alert('I will keep trying 😄')">No</button>
  </div>

</div>

<script>

function startExperience(){
  document.getElementById('introScreen').style.display='none';
  document.getElementById('mainContent').style.display='block';
}

/* Slideshow */
let slides = document.querySelectorAll('.slide');
let caption = document.getElementById('captionText');
let currentSlide = 0;

let captions = [
  "Our First Memory",
  "Best Day Ever",
  "Laughing Together",
  "Adventures With You",
  "Forever Us"
];

setInterval(()=>{
  slides[currentSlide].classList.remove('active');
  currentSlide=(currentSlide+1)%slides.length;
  slides[currentSlide].classList.add('active');
  caption.innerText=captions[currentSlide];
},3000);

/* Stack Animation */
let stackImages=document.querySelectorAll('#stackContainer img');
let stackIndex=0;

setInterval(()=>{
  stackImages.forEach((img,i)=>{
    img.style.transform=`translateY(${(i-stackIndex)*10}px) scale(${1-(i-stackIndex)*0.05})`;
    img.style.opacity=(i===stackIndex)?1:0.5;
  });
  stackIndex=(stackIndex+1)%stackImages.length;
},2000);

/* Suspense Text */
let suspenseLines=[
  "I have something to tell you...",
  "You make my life happier...",
  "You are very special to me...",
  "And there is one question..."
];
let suspenseIndex=0;

setInterval(()=>{
  if(document.getElementById('mainContent').style.display==='block'){
    document.getElementById('suspenseText').innerText=suspenseLines[suspenseIndex];
    suspenseIndex=(suspenseIndex+1)%suspenseLines.length;
  }
},4000);

/* Game */
function showGame(){
  document.getElementById('mainContent').style.display='none';
  document.getElementById('gameScreen').style.display='block';
}

function checkGame(){
  let ans=document.getElementById('gameInput').value.toLowerCase();
  if(ans.includes('you')||ans.includes('versha')){
    document.getElementById('gameResult').innerText='Correct 😄';
    setTimeout(()=>{
      document.getElementById('gameScreen').style.display='none';
      document.getElementById('finalScreen').style.display='block';
    },1500);
  } else {
    document.getElementById('gameResult').innerText='Hint: It is YOU ❤️';
  }
}

</script>

</body>
</html>
