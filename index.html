<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Secret 🔒</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --accent: #ff4d6d; --glow: #ffd0d0; }
        
        body { 
            margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; 
            font-family: 'Arial', sans-serif; overflow: hidden;
            background: radial-gradient(circle, #fff0f3 0%, #ffb3c1 100%);
            transition: background 0.5s;
        }

        /* Screen Glow Effect */
        .glow-active {
            animation: screenGlow 1s infinite alternate;
        }
        @keyframes screenGlow {
            from { box-shadow: inset 0 0 50px var(--accent); }
            to { box-shadow: inset 0 0 150px #ff00ea; }
        }

        .hidden { display: none !important; }

        /* Card Stack */
        .stack-container { position: relative; width: 320px; height: 450px; }
        .card { 
            position: absolute; width: 100%; height: 100%; background: white; 
            border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.15); 
            padding: 12px; box-sizing: border-box; transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.3, 1.2), opacity 0.5s; 
            cursor: pointer; border: 8px solid white;
        }
        .card img { width: 100%; height: 80%; object-fit: cover; border-radius: 12px; }
        .caption { margin-top: 15px; color: var(--accent); font-weight: bold; font-size: 1.1rem; text-align: center; }

        /* Prank Game Buttons */
        .btn-wrap { position: relative; height: 160px; margin-top: 20px; width: 300px;}
        button { 
            padding: 18px 45px; font-size: 1.3rem; border: none; border-radius: 50px; 
            cursor: pointer; font-weight: bold; transition: 0.2s;
        }
        .yes-btn { background: var(--accent); color: white; box-shadow: 0 5px 20px rgba(255,77,109,0.5); z-index: 100; }
        .no-btn { background: #eee; color: #999; position: absolute; left: 50%; transform: translateX(-50%); }

        /* Final Celebration */
        #victory { text-align: center; display: none; flex-direction: column; align-items: center; }
        .piggy-boss { font-size: 8rem; animation: swing 1s infinite; }
        @keyframes swing {
            0%, 100% { transform: rotate(-10deg) scale(1); }
            50% { transform: rotate(10deg) scale(1.1); }
        }
        
        /* Sparkle Class */
        .sparkle { position: fixed; pointer-events: none; animation: fly 1s forwards; font-size: 20px; }
        @keyframes fly { to { transform: translate(var(--tw), var(--th)); opacity: 0; } }
    </style>
</head>
<body id="body-bg">

    <audio id="bgMusic" loop>
        <source src="YOUR_DIRECT_MP3_URL_HERE" type="audio/mpeg">
    </audio>

    <div id="game-box" style="background:white; padding:40px; border-radius:30px; border:3px dashed var(--accent); text-align:center;">
        <h1 style="color:var(--accent)">🔒 Private Access</h1>
        <p>Password: <b>I LOVE YOU</b></p>
        <input type="text" id="pass-input" placeholder="Type here..." 
               style="width: 90%; padding: 15px; border: 2px solid var(--accent); border-radius: 15px; text-align: center;" 
               oninput="checkPass()">
    </div>

    <div id="main-content" class="hidden">
        <div class="stack-container" id="stack">
            <div class="card" onclick="popCard(this)"><img src="IMG_0697.jpeg"><div class="caption">Forever begins here... 🐽</div></div>
            <div class="card" onclick="popCard(this)"><img src="IMG_0541.jpeg"><div class="caption">You're my favorite human!</div></div>
            <div class="card" onclick="popCard(this)"><img src="IMG_0514.jpeg"><div class="caption">Look at us! ❤️</div></div>
            <div class="card" onclick="popCard(this)"><img src="IMG_0462.jpeg"><div class="caption">The prettiest face ever.</div></div>
            <div class="card" onclick="popCard(this)"><img src="IMG_0461.jpeg"><div class="caption">Remember this?</div></div>
            <div class="card" onclick="popCard(this)"><img src="IMG_0444.jpeg"><div class="caption">Click to reveal my secret... ✨</div></div>
        </div>

        <div id="ask-section" class="hidden" style="text-align:center;">
            <h1 style="color: var(--accent); font-size: 2.5rem; text-shadow: 2px 2px white;">Will you be my Valentine? 🌹</h1>
            <div class="btn-wrap">
                <button class="yes-btn" onclick="celebrate()">YES!</button>
                <button class="no-btn" id="no-btn" onmouseover="moveNo()">No</button>
            </div>
        </div>

        <div id="victory">
            <div class="piggy-boss">🐷</div>
            <h1 style="color: var(--accent); font-size: 3rem;">MY LITTLE PIGGY! 🐽</h1>
            <p style="font-size: 1.5rem;">Prepare for cuddles! 💖✨🥳</p>
        </div>
    </div>

    <script>
        function checkPass() {
            if (document.getElementById('pass-input').value.toUpperCase() === "I LOVE YOU") {
                document.getElementById('bgMusic').play().catch(() => {});
                document.getElementById('game-box').classList.add('hidden');
                document.getElementById('main-content').classList.remove('hidden');
            }
        }

        let popped = 0;
        function popCard(card) {
            card.style.transform = `translate(${Math.random() * 600 - 300}px, -900px) rotate(90deg)`;
            card.style.opacity = "0";
            popped++;
            if (popped === 6) { // Now 6 cards
                setTimeout(() => {
                    document.getElementById('stack').classList.add('hidden');
                    document.getElementById('ask-section').classList.remove('hidden');
                }, 600);
            }
        }

        function moveNo() {
            const btn = document.getElementById('no-btn');
            btn.style.position = 'fixed';
            btn.style.left = Math.random() * 80 + '%';
            btn.style.top = Math.random() * 80 + '%';
            btn.innerText = "Try Harder! 😂";
            createSparkle(event.pageX, event.pageY);
        }

        function createSparkle(x, y) {
            const s = document.createElement('div');
            s.className = 'sparkle';
            s.innerHTML = '✨';
            s.style.left = x + 'px';
            s.style.top = y + 'px';
            s.style.setProperty('--tw', (Math.random()*200-100)+'px');
            s.style.setProperty('--th', (Math.random()*200-100)+'px');
            document.body.appendChild(s);
            setTimeout(() => s.remove(), 1000);
        }

        function celebrate() {
            document.getElementById('ask-section').classList.add('hidden');
            document.getElementById('victory').style.display = 'flex';
            document.getElementById('body-bg').classList.add('glow-active');

            // Massive Paper Shred & Piggy Blast
            const scalar = 4;
            const shapes = [
                confetti.shapeFromText({ text: '🐷', scalar }),
                confetti.shapeFromText({ text: '🐽', scalar }),
                confetti.shapeFromText({ text: '💖', scalar }),
                confetti.shapeFromText({ text: '📄', scalar }) // Paper shreds
            ];

            const end = Date.now() + (5 * 1000);

            (function frame() {
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    shapes: shapes,
                    scalar: 2
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    shapes: shapes,
                    scalar: 2
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
            
            // Funny random alert at the end
            setTimeout(() => {
                alert("Contract Signed! 📝 No returns allowed. You are officially my Dalenvine! 🐷❤️");
            }, 2000);
        }
    </script>
</body>
</html>
