<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Message For You</title>
    <style>
        :root {
            --pink: #ff4d6d;
            --light-pink: #ffb3c1;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #fff0f3;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            overflow: hidden;
        }

        .container {
            text-align: center;
            position: relative;
            width: 300px;
        }

        /* The Photo Stack */
        .stack {
            position: relative;
            width: 300px;
            height: 400px;
            margin-bottom: 20px;
        }

        .card {
            position: absolute;
            width: 100%;
            height: 100%;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            padding: 10px;
            box-sizing: border-box;
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1), opacity 0.3s;
            cursor: pointer;
            border: 5px solid white;
        }

        .card img {
            width: 100%;
            height: 80%;
            object-fit: cover;
            border-radius: 10px;
        }

        .caption {
            margin-top: 15px;
            font-style: italic;
            color: #555;
            font-size: 1.1rem;
        }

        /* Final Question Styling */
        #final-ask {
            display: none;
            flex-direction: column;
            align-items: center;
        }

        h1 { color: var(--pink); margin-bottom: 20px; }

        .buttons button {
            padding: 10px 25px;
            font-size: 1.2rem;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            margin: 0 10px;
            transition: transform 0.2s;
        }

        .yes-btn { background-color: var(--pink); color: white; }
        .no-btn { background-color: #ddd; }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <div id="photo-stack" class="stack">
            
            <div class="card" onclick="nextCard(this)">
                <img src="https://via.placeholder.com/300x400?text=Photo+5" alt="Photo 5">
                <div class="caption">And mostly, I love being with you.</div>
            </div>

            <div class="card" onclick="nextCard(this)">
                <img src="https://via.placeholder.com/300x400?text=Photo+4" alt="Photo 4">
                <div class="caption">I love how you make me laugh...</div>
            </div>

            <div class="card" onclick="nextCard(this)">
                <img src="https://via.placeholder.com/300x400?text=Photo+3" alt="Photo 3">
                <div class="caption">Every moment feels like a movie.</div>
            </div>

            <div class="card" onclick="nextCard(this)">
                <img src="https://via.placeholder.com/300x400?text=Photo+2" alt="Photo 2">
                <div class="caption">Remember this day? I still do.</div>
            </div>

            <div class="card" onclick="nextCard(this)">
                <img src="https://via.placeholder.com/300x400?text=Photo+1" alt="Photo 1">
                <div class="caption">Click to see our memories... ❤️</div>
            </div>
        </div>

        <div id="final-ask">
            <h1>Will you be my Valentine? 🌹</h1>
            <div class="buttons">
                <button class="yes-btn" onclick="celebrate()">YES!</button>
                <button class="no-btn" id="no-button" onmouseover="moveButton()">No</button>
            </div>
        </div>
    </div>

    <script>
        let cardsPopped = 0;
        const totalCards = 5;

        function nextCard(cardElement) {
            // Animation: Fly away to the right and rotate
            cardElement.style.transform = "translateX(500px) rotate(30deg)";
            cardElement.style.opacity = "0";
            
            cardsPopped++;

            // After all cards are gone, show the question
            if (cardsPopped === totalCards) {
                setTimeout(() => {
                    document.getElementById('photo-stack').classList.add('hidden');
                    document.getElementById('final-ask').style.display = 'flex';
                }, 600);
            }
        }

        // Fun trick: The 'No' button moves away when they try to click it
        function moveButton() {
            const btn = document.getElementById('no-button');
            const x = Math.random() * (window.innerWidth - btn.offsetWidth);
            const y = Math.random() * (window.innerHeight - btn.offsetHeight);
            btn.style.position = 'absolute';
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }

        function celebrate() {
            alert("Yay! Best Valentine's ever! ❤️");
            // You can add confetti or redirect to a music video here
        }
    </script>
</body>
</html>
