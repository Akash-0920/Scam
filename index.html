<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Secret for You 🔒</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --accent: #ff4d6d; --soft: #ffb3c1; }
        
        body { 
            margin: 0; 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-family: 'Arial', sans-serif;
            background: linear-gradient(-45deg, #fff0f3, #ffb3c1, #f8edeb, #ffe5ec);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .hidden { display: none !important; }

        /* General Card/Box Styling */
        .glass-box {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(255, 77, 109, 0.2);
            text-align: center;
            border: 2px solid white;
            max-width: 320px;
        }

        /* Photo Stack */
        .stack-container { position: relative; width: 320px; height: 450px; }
        .card { 
            position: absolute; width: 100%; height: 100%; background: white; 
            border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); 
            padding: 10px; box-sizing: border-box; transition: transform 0.7s cubic-bezier(0.2, 0.8, 0.3, 1.2), opacity 0.5s; 
            cursor: pointer; border: 6px solid white;
        }
        .card img { width: 100%; height: 80%; object-fit: cover; border-radius: 8px; }
        .caption { margin-top: 15px; color: var(--accent); font-weight: bold; font-size: 1.1rem; }

        /* Buttons */
        .btn-wrap { position: relative; height: 160px; margin-top: 20px; }
        button { 
            padding: 15px 40px; font-size: 1.2rem; border: none; border-radius: 50px; 
            cursor: pointer; font-weight: bold; transition: transform 0.2s;
        }
        .yes-btn { background: var(--accent); color: white; box-shadow: 0 5px 15px rgba(255,77,109,0.4); }
        .no-btn { background: #eee; color: #777; position: absolute; left: 50%; transform: translateX(-50%); }

        /* Final Piggy Display */
        #victory { text-align: center; display: none; flex-direction: column; align-items: center; }
        .piggy-icon { font-size: 6rem; filter: drop-shadow(0 0 10px pink); }
    </style>
</head>
<body>

    <audio id="bgMusic" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <div id="game-box" class="glass-box">
        <h2 style="color: var(--accent);">Locked with Love 🔒</h2>
        <p>Enter the secret words to enter:</p>
        <input type="text" id="pass-input" placeholder="Hint: I L*** Y**" 
               style="width: 80%; padding: 12px; border: 2px solid var(--accent); border-radius: 10px; text-align: center; outline: none;" 
               oninput="checkPass()">
    </div>

    <div id="main-content" class="hidden">
        <div class="stack-container" id="stack">
            <div class="card" onclick="popCard(this)"><img src="IMG_0448.jpeg"><div class="caption">Forever to go... 🐽</div></div>
            <div class="card" onclick="popCard(this)"><img src="IMG_0447.jpeg"><div class="caption">The best decision was you.</div></div>
            <div class="card" onclick="popCard(this)"><img src="IMG_0446.jpeg"><div class="caption">Look at that smile! ❤️</div></div>
            <div class="card" onclick="popCard(this)"><img src="IMG_0445.jpeg"><div class="caption">My favorite memory.</div></div>
            <div class="card" onclick="popCard(this)"><img src="IMG_0444.jpeg"><div class="caption">Click to look back...</div></div>
        </div>

        <div id="ask-section" class="hidden">
            <h1 style="color: var(--accent);">Will you be my Valentine? 🌹</h1>
            <div class="btn-wrap">
                <button class="yes-btn" onclick="celebrate()">YES!</button>
                <button class="no-btn" id="no-btn" onmouseover="moveNo()">No</button>
            </div>
        </div>

        <div id="victory">
            <div class="piggy-icon">🐷</div>
            <h1 style="color: var(--accent); font-size: 2.5rem;">I KNEW IT! ❤️</h1>
            <p style="font-size: 1.2rem;">You're my favorite little piggy! 🐽✨</p>
        </div>
    </div>

    <script>
        const bgMusic = document.getElementById('bgMusic');

        function checkPass() {
            const val = document.getElementById('pass-input').value.toUpperCase();
            if (val === "I LOVE YOU") {
                bgMusic.play().catch(e => console.log("Audio waiting for interaction"));
                document.getElementById('game-box').classList.add('hidden');
                document.getElementById('main-content').classList.remove('hidden');
            }
        }

        let popped = 0;
        function popCard(card) {
            card.style.transform = `translate(${Math.random() * 800 - 400}px, -800px) rotate(${Math.random() * 120 - 60}deg)`;
            card.style.opacity = "0";
            popped++;
            if (popped === 5) {
                setTimeout(() => {
                    document.getElementById('stack').classList.add('hidden');
                    document.getElementById('ask-section').classList.remove('hidden');
                }, 600);
            }
        }

        function moveNo() {
            const btn = document.getElementById('no-btn');
            const x = Math.random() * (window.innerWidth - 100);
            const y = Math.random() * (window.innerHeight - 100);
            btn.style.position = 'fixed';
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
            btn.innerText = "Error 🚫";
        }

        function celebrate() {
            document.getElementById('ask-section').classList.add('hidden');
            document.getElementById('victory').style.display = 'flex';

            // Custom "Paper Shreds" and Piggy Confetti
            const scalar = 4;
            const pig = confetti.shapeFromText({ text: '🐷', scalar });
            const heart = confetti.shapeFromText({ text: '💖', scalar });
            const shred = confetti.shapeFromText({ text: '🎟️', scalar });

            const defaults = {
                spread: 120,
                ticks: 150,
                gravity: 1.2,
                decay: 0.94,
                startVelocity: 45,
                shapes: [pig, heart, shred, 'circle'],
                colors: ['#ff4d6d', '#ffb3c1', '#ffffff', '#ffccd5']
            };

            confetti({ ...defaults, particleCount: 80, origin: { y: 0.7 } });
            confetti({ ...defaults, particleCount: 40, spread: 180, origin: { y: 0.8 } });
            
            // Repeat a few times for "shredded" look
            setTimeout(() => {
                confetti({ ...defaults, particleCount: 50, origin: { y: 0.7 } });
            }, 300);
        }
    </script>
</body>
</html>
